name: validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Compose configuration
        run: docker compose -f configs/relcompat3d/compose.yaml config --quiet
      - name: Compile Python sources
        run: python -m compileall -q src/relcompat3d
      - name: Validate frozen evidence
        run: python scripts/validate_repository.py
