name: validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Compose configuration
        run: |
          docker compose -f configs/relcompat3d/compose.yaml config --quiet
          docker compose -f configs/open3dsg/compose.yaml config --quiet
      - name: Compile Python sources
        run: python -m compileall -q src/relcompat3d
      - name: Install synthetic-test dependency
        run: python -m pip install numpy==1.26.4
      - name: Run synthetic functional pipeline
        run: python -m unittest discover -s tests -v
      - name: Validate frozen evidence
        run: python scripts/validate_repository.py
