services:
  relcompat3d_export_rows:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/build_reproduction_rows.py]
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/RelCompat3D_geom_reliability/row_reproduction_v1/protocol.json
      - --out
      - /workspace/experiments/RelCompat3D_geom_reliability/row_reproduction_v1/artifacts/derived_rows

