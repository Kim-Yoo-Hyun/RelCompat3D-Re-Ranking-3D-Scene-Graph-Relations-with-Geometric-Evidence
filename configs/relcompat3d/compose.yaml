    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/create_local_key.py]
    command:
      - --out
      - /workspace/local_dataset/RelCompat3D/secrets/table_rows_hmac_key.txt

