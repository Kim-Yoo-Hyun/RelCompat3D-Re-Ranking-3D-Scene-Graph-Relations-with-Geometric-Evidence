services:
  relcompat3d_adapt_vlsat:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/adapt_source_predictions.py]
    command:
      - --source
      - vlsat
      - --raw
      - /workspace/local_dataset/RelCompat3D/source_outputs/vlsat/raw.jsonl
      - --subset
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships_validation.json
      - --relationships
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships.txt
      - --out
      - /workspace/local_dataset/RelCompat3D/prepared/vlsat/predictions.jsonl
      - --baseline-run-id
      - vlsat_official_validation
      - --split-name
      - official_validation

  relcompat3d_adapt_sgfn:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/adapt_source_predictions.py]
    command:
      - --source
      - sgfn
      - --raw
      - /workspace/local_dataset/RelCompat3D/source_outputs/sgfn/raw.jsonl
      - --subset
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships_validation.json
      - --relationships
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships.txt
      - --out
      - /workspace/local_dataset/RelCompat3D/prepared/sgfn/predictions.jsonl
      - --baseline-run-id
      - sgfn_official_validation
      - --split-name
      - official_validation

  relcompat3d_adapt_open3dsg:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/adapt_source_predictions.py]
    command:
      - --source
      - open3dsg
      - --raw
      - /workspace/local_dataset/RelCompat3D/source_outputs/open3dsg/raw.jsonl
      - --subset
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships_validation.json
      - --relationships
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships.txt
      - --out
      - /workspace/local_dataset/RelCompat3D/prepared/open3dsg/predictions.jsonl
      - --baseline-run-id
      - open3dsg_official_validation
      - --split-name
      - official_validation

  relcompat3d_build_ground_truth:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/build_ground_truth.py]
    command:
      - --subset
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships_validation.json
      - --relationships
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships.txt
      - --out
      - /workspace/local_dataset/RelCompat3D/prepared/ground_truth.jsonl
      - --split-name
      - official_validation

  relcompat3d_verify_vlsat:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/build_verification_rows.py]
    command:
      - --predictions-jsonl
      - /workspace/local_dataset/RelCompat3D/prepared/vlsat/predictions.jsonl
      - --dataset-root
      - /workspace/local_dataset
      - --output-dir
      - /workspace/local_dataset/RelCompat3D/prepared/vlsat
      - --verification-policy
      - point_subtype

  relcompat3d_verify_sgfn:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/build_verification_rows.py]
    command:
      - --predictions-jsonl
      - /workspace/local_dataset/RelCompat3D/prepared/sgfn/predictions.jsonl
      - --dataset-root
      - /workspace/local_dataset
      - --output-dir
      - /workspace/local_dataset/RelCompat3D/prepared/sgfn
      - --verification-policy
      - point_subtype

  relcompat3d_verify_open3dsg:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/build_verification_rows.py]
    command:
      - --predictions-jsonl
      - /workspace/local_dataset/RelCompat3D/prepared/open3dsg/predictions.jsonl
      - --dataset-root
      - /workspace/local_dataset
      - --output-dir
      - /workspace/local_dataset/RelCompat3D/prepared/open3dsg
      - --verification-policy
      - point_subtype

  relcompat3d_evaluate:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/evaluate_predictions.py]
    command:
      - --annotations
      - /workspace/local_dataset/RelCompat3D/3DSSG_subset/relationships_validation.json
      - --ground-truth
      - /workspace/local_dataset/RelCompat3D/prepared/ground_truth.jsonl
      - --linear-models
      - /workspace/experiments/relcompat3d/main/regenerated/fit/linear_models.json
      - --mlp-models
      - /workspace/experiments/relcompat3d/main/regenerated/mlp/models.json
      - --vlsat
      - /workspace/local_dataset/RelCompat3D/prepared/vlsat/verification.jsonl
      - --open3dsg
      - /workspace/local_dataset/RelCompat3D/prepared/open3dsg/verification.jsonl
      - --sgfn
      - /workspace/local_dataset/RelCompat3D/prepared/sgfn/verification.jsonl
      - --out
      - /workspace/experiments/relcompat3d/main/regenerated/evaluation

  relcompat3d_export_rows:
    build:
      context: ../..
      dockerfile: configs/relcompat3d/Dockerfile
    image: relcompat3d-geom-reliability:latest
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ../..:/workspace
    entrypoint: [python, /workspace/src/relcompat3d/build_reproduction_rows.py]
    command:
      - --repo-root
      - /workspace
      - --protocol
      - /workspace/experiments/relcompat3d/paper_results/reproduction_protocol.json
      - --out
      - /workspace/experiments/relcompat3d/paper_results/regenerated/rows

  relcompat3d_create_local_key:
